[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "troubleshoot-agent"
version = "0.1.0"
description = "Bounded Windows troubleshooting with Gemma"
requires-python = ">=3.11"
dependencies = ["fastapi==0.142.4", "uvicorn==0.54.0", "httpx==0.28.1"]

[project.scripts]
troubleshoot = "troubleshoot.api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/troubleshoot/web" = ["web/index.html", "web/app.js", "web/style.css"]

[tool.setuptools.package-data]
"troubleshoot.windows" = ["*.ps1"]
"troubleshoot.desktop" = ["*.ps1"]
